<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7">
<title>سدرة — مساحة مشاريعك</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
:root{--ink:#1d1d1f;--muted:#6e6e73;--blue:#0071e3;--bg:#f5f5f7;--card:#fff;--line:#e8e8ed;--green:#16834b;--shadow:0 12px 36px #1d1d1f0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{height:64px;background:#ffffffd9;backdrop-filter:blur(20px);border-bottom:1px solid #e5e5e5;position:sticky;top:0;z-index:5}.top-inner{max-width:1120px;height:100%;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:-.5px}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#b3d8a6,#568c62);display:grid;place-items:center;color:white;font-size:20px;box-shadow:inset 0 1px 2px #ffffff70}.top-note{font-size:13px;color:var(--muted)}main{max-width:1120px;margin:0 auto;padding:72px 24px 80px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:25px;margin-bottom:42px}.eyebrow{color:var(--green);font-weight:600;font-size:14px;margin:0 0 10px}.hero h1{font-size:clamp(38px,6vw,58px);line-height:1.17;letter-spacing:-2px;margin:0 0 12px;font-weight:700}.hero p{color:var(--muted);font-size:18px;margin:0;line-height:1.7}.primary{background:var(--blue);border:0;color:#fff;border-radius:24px;padding:12px 20px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 3px 8px #0071e333;transition:.2s;white-space:nowrap}.primary:hover{background:#0077ed;transform:translateY(-1px)}.plus{font-size:21px;line-height:16px;font-weight:400}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:42px}.stat{background:var(--card);border:1px solid #ebebef;border-radius:19px;padding:19px 22px}.stat span{font-size:13px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:5px;letter-spacing:-.5px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:17px}.toolbar h2{font-size:24px;margin:0;letter-spacing:-.5px}.tools{display:flex;gap:9px}.search{position:relative}.search input{width:230px;padding:10px 37px 10px 14px;border:1px solid #dddde2;border-radius:12px;background:#fff;outline:none}.search input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:#7db8f3;box-shadow:0 0 0 3px #0071e31a}.search span{position:absolute;right:13px;top:8px;color:#8b8b91}.select{border:1px solid #dddde2;border-radius:12px;background:#fff;padding:9px 12px;color:#46464a;outline:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.project{background:#fff;border:1px solid #ebebef;border-radius:20px;overflow:hidden;transition:transform .22s,box-shadow .22s;cursor:pointer;min-height:270px;display:flex;flex-direction:column}.project:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.card-top{height:118px;padding:20px 21px;display:flex;align-items:flex-start;justify-content:space-between}.emoji{font-size:36px;width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:#f5f5f7}.badge{font-size:12px;padding:6px 11px;border-radius:20px;background:#f1f1f3;color:#626268}.badge.active{background:#e6f5ec;color:#137a43}.badge.paused{background:#fff3db;color:#9a6500}.badge.done{background:#eaf2ff;color:#2467b2}.card-body{padding:2px 21px 21px;flex:1}.card-body h3{margin:0 0 7px;font-size:20px;letter-spacing:-.35px}.card-body p{margin:0;color:var(--muted);font-size:14px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-foot{padding:14px 21px;border-top:1px solid #f0f0f2;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#85858b}.more{border:0;background:transparent;color:#6e6e73;font-size:20px;border-radius:8px;line-height:1;padding:3px 8px}.more:hover{background:#f3f3f5}.empty{grid-column:1/-1;text-align:center;background:white;border:1px solid var(--line);border-radius:22px;padding:58px 20px}.empty-icon{font-size:40px;margin-bottom:10px}.empty h3{font-size:20px;margin:0 0 7px}.empty p{color:var(--muted);margin:0 0 20px}.modal-back{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px;z-index:10;backdrop-filter:blur(6px)}.modal-back.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:27px;box-shadow:0 25px 80px #0003;animation:rise .2s ease}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.modal-head h2{font-size:24px;margin:0}.close{border:0;background:#f2f2f4;width:34px;height:34px;border-radius:50%;font-size:20px;color:#666}.field{margin-bottom:16px}.field label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #d8d8dd;border-radius:12px;padding:11px 13px;outline:none;background:white}.field textarea{resize:vertical;min-height:92px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.secondary{border:1px solid #dedee3;background:#fff;color:#333;border-radius:22px;padding:10px 17px;font-weight:500}.danger{border:0;background:transparent;color:#d93025;font-weight:500;padding:9px}.detail-desc{white-space:pre-wrap;line-height:1.85;color:#555;font-size:15px}.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.meta-box{background:#f6f6f8;border-radius:13px;padding:12px 14px}.meta-box span{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}.meta-box strong{font-size:14px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#1d1d1f;color:white;border-radius:22px;padding:11px 18px;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}footer{text-align:center;color:#96969b;font-size:12px;padding:0 20px 30px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:flex-start;flex-direction:column}.hero .primary{align-self:flex-start}.stats{gap:9px}.stat{padding:15px}}@media(max-width:560px){main{padding:45px 17px 58px}.top-inner{padding:0 17px}.top-note{font-size:11px}.hero h1{letter-spacing:-1.4px}.hero p{font-size:16px}.stats{grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:12px 10px;border-radius:14px}.stat span{font-size:11px}.stat strong{font-size:22px}.toolbar{align-items:flex-start;flex-direction:column}.tools{width:100%}.search{flex:1}.search input{width:100%}.grid{grid-template-columns:1fr;gap:12px}.project{min-height:245px}.card-top{height:105px}.two{grid-template-columns:1fr}.modal{padding:21px;border-radius:20px}.form-actions{gap:8px}.detail-meta{grid-template-columns:1fr 1fr}}
.welcome{position:fixed;inset:0;z-index:30;background:#111;display:grid;place-items:center;overflow:hidden}.welcome-art{position:relative;width:min(100vw,177.07vh);aspect-ratio:1027/580}.welcome-art img{display:block;width:100%;height:100%;object-fit:contain}.welcome-cta{position:absolute;right:13.2%;bottom:12.7%;width:31.3%;height:8.9%;border:0;border-radius:999px;background:transparent;cursor:pointer}.welcome-cta:focus-visible{outline:3px solid #fff;outline-offset:3px}.mobile-enter{display:none}#dashboard[hidden],.welcome[hidden]{display:none!important}@media(max-aspect-ratio:4/5){.welcome{align-content:center;gap:18px}.welcome-art{width:min(100vw,177.07vh)}.welcome-cta{display:none}.mobile-enter{display:block;background:#3923d5;color:#fff;border:0;border-radius:28px;padding:14px 26px;font-weight:700;font-size:16px;box-shadow:0 5px 18px #0006}}
</style></head>
<body><section class="welcome" id="welcome" aria-label="واجهة الترحيب بسدرة"><div class="welcome-art"><img src="sidrah-welcome.png" alt="شركة سدرة للمشاريع والتطوير"><button class="welcome-cta" id="enterSidrah" aria-label="الدخول إلى مشاريع سدرة" title="الدخول إلى مشاريع سدرة"></button></div><button class="mobile-enter" id="mobileEnter">الدخول إلى مشاريع سدرة</button></section><div id="dashboard" hidden><header class="topbar"><div class="top-inner"><div class="brand"><div class="logo">س</div><span>سدرة</span></div><span class="top-note">مساحتك لأفكارك ومشاريعك</span></div></header>
<main><section class="hero"><div><p class="eyebrow">مساحتك الخاصة</p><h1>كل مشاريعك،<br>في مكان واحد.</h1><p>مساحة هادئة لتنظيم أفكارك ومتابعة ما تصنعه.</p></div><button class="primary" id="addBtn"><span class="plus">＋</span> مشروع جديد</button></section>
<section class="stats"><div class="stat"><span>إجمالي المشاريع</span><strong id="totalCount">٠</strong></div><div class="stat"><span>قيد العمل</span><strong id="activeCount">٠</strong></div><div class="stat"><span>مكتملة</span><strong id="doneCount">٠</strong></div></section>
<section><div class="toolbar"><h2>مشاريعك</h2><div class="tools"><label class="search"><span>⌕</span><input id="search" placeholder="ابحث عن مشروع..." aria-label="ابحث عن مشروع"></label><select class="select" id="filter" aria-label="تصفية المشاريع"><option value="all">كل المشاريع</option><option value="active">قيد العمل</option><option value="paused">متوقفة</option><option value="done">مكتملة</option></select></div></div><div class="grid" id="grid"></div></section></main><footer>صُنعت لتكون مساحتك — بياناتك محفوظة على هذا الجهاز</footer></div>
<div class="modal-back" id="editor"><div class="modal"><div class="modal-head"><h2 id="formTitle">مشروع جديد</h2><button class="close" data-close="editor" aria-label="إغلاق">×</button></div><form id="projectForm"><input type="hidden" id="projectId"><div class="field"><label for="name">اسم المشروع</label><input id="name" required maxlength="60" placeholder="مثال: متجر سدرة الإلكتروني"></div><div class="field"><label for="description">نبذة قصيرة</label><textarea id="description" maxlength="500" placeholder="ما فكرة المشروع؟ وما الذي تريد إنجازه؟"></textarea></div><div class="two"><div class="field"><label for="status">الحالة</label><select id="status"><option value="active">قيد العمل</option><option value="paused">متوقف مؤقتًا</option><option value="done">مكتمل</option></select></div><div class="field"><label for="category">التصنيف</label><input id="category" maxlength="30" placeholder="شخصي، عمل، فكرة..."></div></div><div class="field"><label for="notes">ملاحظات</label><textarea id="notes" maxlength="1000" placeholder="أضف تفاصيل أو خطوات تود تذكرها..."></textarea></div><div class="form-actions"><button class="danger" type="button" id="deleteBtn" style="visibility:hidden">حذف المشروع</button><button class="primary" type="submit">حفظ المشروع</button></div></form></div></div>
<div class="modal-back" id="details"><div class="modal"><div class="modal-head"><h2 id="detailTitle"></h2><button class="close" data-close="details" aria-label="إغلاق">×</button></div><div id="detailContent"></div><div class="form-actions"><button class="secondary" id="editFromDetail">تعديل المشروع</button><button class="primary" data-close="details">تم</button></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='sidrah-projects-v1';let projects=[];try{projects=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{projects=[]}
function enterSidrah(){ $('#welcome').hidden=true; $('#dashboard').hidden=false; window.scrollTo(0,0) }
const $=s=>document.querySelector(s), labels={active:'قيد العمل',paused:'متوقف مؤقتًا',done:'مكتمل'};let selected=null;
$('#enterSidrah').addEventListener('click',enterSidrah);$('#mobileEnter').addEventListener('click',enterSidrah);
function save(){localStorage.setItem(KEY,JSON.stringify(projects));render()}
function num(n){return new Intl.NumberFormat('ar-SA').format(n)}
function render(){const term=$('#search').value.trim().toLocaleLowerCase('ar'),filter=$('#filter').value;$('#totalCount').textContent=num(projects.length);$('#activeCount').textContent=num(projects.filter(p=>p.status==='active').length);$('#doneCount').textContent=num(projects.filter(p=>p.status==='done').length);let list=projects.filter(p=>(filter==='all'||p.status===filter)&&(`${p.name} ${p.description} ${p.category}`.toLocaleLowerCase('ar').includes(term)));$('#grid').innerHTML=list.length?list.map(p=>`<article class="project" data-id="${p.id}"><div class="card-top"><div class="emoji">${p.emoji||'🌱'}</div><span class="badge ${p.status}">${labels[p.status]||labels.active}</span></div><div class="card-body"><h3>${esc(p.name)}</h3><p>${esc(p.description||'أضف نبذة قصيرة عن مشروعك.')}</p></div><div class="card-foot"><span>${esc(p.category||'مشروع شخصي')} · ${date(p.updated)}</span><button class="more" data-edit="${p.id}" title="تعديل المشروع">•••</button></div></article>`).join(''):`<div class="empty"><div class="empty-icon">${projects.length?'🔎':'🌿'}</div><h3>${projects.length?'لم نعثر على مشروع':'ابدأ أول فصولك'}</h3><p>${projects.length?'جرّب تغيير كلمات البحث أو التصفية.':'أضف مشروعك الأول، وستجده هنا دائمًا.'}</p>${projects.length?'':'<button class="primary" id="emptyAdd"><span class="plus">＋</span> أضف مشروعك الأول</button>'}</div>`;$('#grid').querySelectorAll('.project').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-edit]')){e.stopPropagation();openEdit(el.dataset.id)}else openDetails(el.dataset.id)}));$('#emptyAdd')?.addEventListener('click',openNew)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(v){try{return new Intl.DateTimeFormat('ar-SA',{day:'numeric',month:'short'}).format(new Date(v))}catch{return ''}}
function openNew(){$('#projectForm').reset();$('#projectId').value='';$('#formTitle').textContent='مشروع جديد';$('#deleteBtn').style.visibility='hidden';$('#editor').classList.add('show');setTimeout(()=>$('#name').focus(),80)}function openEdit(id){let p=projects.find(x=>x.id===id);if(!p)return;$('#projectForm').reset();$('#projectId').value=p.id;$('#name').value=p.name;$('#description').value=p.description||'';$('#status').value=p.status;$('#category').value=p.category||'';$('#notes').value=p.notes||'';$('#formTitle').textContent='تعديل المشروع';$('#deleteBtn').style.visibility='visible';$('#editor').classList.add('show')}
function openDetails(id){let p=projects.find(x=>x.id===id);if(!p)return;selected=id;$('#detailTitle').textContent=p.name;$('#detailContent').innerHTML=`<div class="detail-meta"><div class="meta-box"><span>الحالة</span><strong>${labels[p.status]}</strong></div><div class="meta-box"><span>التصنيف</span><strong>${esc(p.category||'مشروع شخصي')}</strong></div><div class="meta-box"><span>آخر تحديث</span><strong>${date(p.updated)}</strong></div><div class="meta-box"><span>تاريخ الإضافة</span><strong>${date(p.created)}</strong></div></div><div class="detail-desc">${esc(p.description||'لا توجد نبذة بعد.')}${p.notes?`\n\nملاحظات\n${esc(p.notes)}`:''}</div>${p.url?`<p><a class="primary" style="display:inline-flex;text-decoration:none;margin-top:18px" href="${esc(p.url)}">افتح الموقع ↗</a></p>`:''}`;$('#details').classList.add('show')}
$('#addBtn').addEventListener('click',openNew);$('#search').addEventListener('input',render);$('#filter').addEventListener('change',render);document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$('#'+b.dataset.close).classList.remove('show')));document.querySelectorAll('.modal-back').forEach(b=>b.addEventListener('click',e=>{if(e.target===b)b.classList.remove('show')}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-back').forEach(b=>b.classList.remove('show'))});$('#editFromDetail').addEventListener('click',()=>{$('#details').classList.remove('show');openEdit(selected)});$('#projectForm').addEventListener('submit',e=>{e.preventDefault();let id=$('#projectId').value,old=projects.find(p=>p.id===id),entry={id:id||crypto.randomUUID(),name:$('#name').value.trim(),description:$('#description').value.trim(),status:$('#status').value,category:$('#category').value.trim(),notes:$('#notes').value.trim(),url:old?.url||'',emoji:old?.emoji||'🌱',created:old?.created||new Date().toISOString(),updated:new Date().toISOString()};if(old)projects=projects.map(p=>p.id===id?entry:p);else projects.unshift(entry);save();$('#editor').classList.remove('show');notify(old?'تم تحديث المشروع':'تمت إضافة المشروع')});$('#deleteBtn').addEventListener('click',()=>{let id=$('#projectId').value;if(!id)return;projects=projects.filter(p=>p.id!==id);save();$('#editor').classList.remove('show');notify('تم حذف المشروع')});function notify(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
if(!projects.some(p=>p.name==='ميزانية العائلة')){let stamp=new Date().toISOString();projects.unshift({id:'family-budget',name:'ميزانية العائلة',description:'موقع لإدارة دخل الأسرة ومصروفاتها ومتابعة الميزانية الشهرية.',status:'active',category:'الأسرة والمال',notes:'الموقع يحفظ البيانات محليًا على هذا الجهاز.',url:'ميزانيتي.html',emoji:'💰',created:stamp,updated:stamp});localStorage.setItem(KEY,JSON.stringify(projects))}render();
</script></body></html>
